# CloudCrane production web and Preview entrypoints.
# The apex itkdm.com remains owned by the existing site.

# Use the original TCP peer address here because the realip module replaces
# $remote_addr with CF-Connecting-IP after the peer has been validated.
geo $realip_remote_addr $cloudflare_proxy {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.itkdm.com;

    if ($cloudflare_proxy = 0) {
        return 403;
    }

    # Authentication links can carry single-use tokens in their URL.
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name *.preview.itkdm.com;

    # Preview URLs may contain short-lived access tokens; never log redirects.
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.itkdm.com;

    if ($cloudflare_proxy = 0) {
        return 403;
    }

    ssl_certificate /etc/letsencrypt/live/cloudcrane-itkdm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudcrane-itkdm/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # app.itkdm.com is proxied by Cloudflare. Trust CF-Connecting-IP only
    # from Cloudflare's published proxy ranges so rate limits use visitor IPs
    # without accepting a spoofed header from direct-origin requests.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/cloudcrane-access.log;
    error_log /var/log/nginx/cloudcrane-error.log warn;

    client_max_body_size 25m;

    location ^~ /agent/v1/internal/ {
        return 404;
    }

    location = /agent/v1/internal {
        return 404;
    }

    # Better Auth verification and reset URLs can contain single-use tokens.
    # Do not write their paths or query strings to the shared access log.
    location ^~ /api/auth {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Prevent token-bearing page URLs from appearing in Referer headers on
    # requests for page assets, which otherwise inherit the default log format.
    location ~ ^/(en/|zh/)?(reset-password|verify-email)/?$ {
        access_log off;
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy no-referrer always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location /agent/ {
        proxy_pass http://127.0.0.1:4101/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.preview.itkdm.com;

    ssl_certificate /etc/letsencrypt/live/cloudcrane-itkdm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudcrane-itkdm/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:4103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
