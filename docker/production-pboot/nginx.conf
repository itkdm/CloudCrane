worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format cloudcrane '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout cloudcrane;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/nginx/client_body;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    proxy_temp_path /tmp/nginx/proxy;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server {
        listen 8080 default_server;
        server_name _;
        root /site/current;
        index index.php index.html;
        client_max_body_size 32m;

        location ^~ /data/ {
            deny all;
        }

        location ^~ /config/ {
            deny all;
        }

        location ^~ /runtime/ {
            deny all;
        }

        location ^~ /core/ {
            deny all;
        }

        location ^~ /apps/ {
            deny all;
        }

        location ~ (^|/)\. {
            deny all;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php(?:/|$) {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /site/current$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTP_PROXY '';
            fastcgi_pass 127.0.0.1:9000;
        }

        location ~* \.(?:bak|conf|ini|log|sql|sqlite|db|ya?ml)$ {
            deny all;
        }
    }
}
