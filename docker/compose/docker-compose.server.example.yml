services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ./postgres.env
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - cloudcrane-postgres:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

volumes:
  cloudcrane-postgres:
