name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cloudcrane
          POSTGRES_PASSWORD: cloudcrane
          POSTGRES_DB: cloudcrane
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cloudcrane -d cloudcrane"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cloudcrane:cloudcrane@localhost:5432/cloudcrane
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @cloudcrane/db db:migrate
      - run: pnpm --filter @cloudcrane/db db:verify

  docker-integration:
    runs-on: ubuntu-latest
    needs: quality
    env:
      CLOUDCRANE_DOCKER_INTEGRATION: '1'
      WORKSPACE_ROOT: /tmp/cloudcrane-workspaces
      WORKSPACE_IMAGE: website-workspace-pboot:v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker build -f docker/workspace-pboot/Dockerfile -t website-workspace-pboot:v1 .
      - run: pnpm --filter @cloudcrane/runner test --run src/docker.integration.test.ts
