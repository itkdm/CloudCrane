name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cloudcrane
          POSTGRES_PASSWORD: cloudcrane
          POSTGRES_DB: cloudcrane
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cloudcrane -d cloudcrane"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cloudcrane:cloudcrane@localhost:5432/cloudcrane
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @cloudcrane/db db:migrate
      - run: pnpm --filter @cloudcrane/db db:verify

  docker-integration:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cloudcrane
          POSTGRES_PASSWORD: cloudcrane
          POSTGRES_DB: cloudcrane
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cloudcrane -d cloudcrane"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CLOUDCRANE_DOCKER_INTEGRATION: '1'
      CLOUDCRANE_REMOTE_INTEGRATION: '1'
      DATABASE_URL: postgresql://cloudcrane:cloudcrane@localhost:5432/cloudcrane
      WORKSPACE_GATEWAY_CLIENT_TOKEN: integration-token
      RUNNER_AUTH_TOKEN: integration-token
      WORKSPACE_ROOT: /tmp/cloudcrane-workspaces
      WORKSPACE_IMAGE: website-workspace-pboot:v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker build -f docker/workspace-pboot/Dockerfile -t website-workspace-pboot:v1 .
      - run: pnpm --filter @cloudcrane/db db:migrate
      - run: pnpm --filter @cloudcrane/runner... build
      - run: pnpm --filter @cloudcrane/workspace-gateway... build
      - run: pnpm --filter @cloudcrane/pi-adapter... build
      - name: Run Docker integration test
        run: |
          set +e
          output=$(pnpm --filter @cloudcrane/runner exec vitest run --exclude dist/** --exclude .next/** src/docker.integration.test.ts 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            detail=$(printf '%s' "$output" | tail -n 40 | tr '\n' ' ' | cut -c1-6000)
            echo "::error title=Docker integration failure::$detail"
            exit "$status"
          fi
      - name: Run remote execution integration test
        run: pnpm --filter @cloudcrane/workspace-gateway exec vitest run --exclude dist/** --exclude .next/** src/remote-execution.integration.test.ts
      - name: Run Pi remote tools integration test
        run: pnpm --filter @cloudcrane/pi-adapter exec vitest run --exclude dist/** --exclude .next/** src/remote-tools.integration.test.ts
