name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: cloudcrane-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Find last successful production deployment
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-production.yml/runs?branch=main&status=completed&per_page=100")"
          base_sha="$(jq -r '[.workflow_runs[] | select(.conclusion == "success")][0].head_sha // ""' <<<"$response")"
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Skip deployment when only documentation changed
        id: changes
        env:
          BASE_SHA: ${{ steps.baseline.outputs.base_sha }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          deploy_required=false
          if [[ -z "$BASE_SHA" ]]; then
            deploy_required=true
          else
            mapfile -t changed_files < <(git diff --name-only --no-renames "$BASE_SHA" "$TARGET_SHA")
            for file in "${changed_files[@]}"; do
              case "$file" in
                docs/*|README.md|*/README.md|AGENTS.md|*/AGENTS.md|CHANGELOG.md|*/CHANGELOG.md|CONTRIBUTING.md|*/CONTRIBUTING.md)
                  ;;
                *)
                  deploy_required=true
                  break
                  ;;
              esac
            done
          fi
          printf 'deploy_required=%s\n' "$deploy_required" >> "$GITHUB_OUTPUT"
          printf 'Deployment required: %s\n' "$deploy_required"

      - name: Deploy the exact CI-verified commit
        if: steps.changes.outputs.deploy_required == 'true'
        env:
          DEPLOY_HOST: 186.244.238.219
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_SSH_KEY: ${{ secrets.CLOUDCRANE_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/cloudcrane_deploy"
          chmod 600 "$HOME/.ssh/cloudcrane_deploy"
          cat > "$HOME/.ssh/known_hosts" <<'KNOWN_HOSTS'
          186.244.238.219 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFDwUjz9spNdqNFvcSgwyxKm6cBKdsMik1TuNlccAVcC
          KNOWN_HOSTS
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/cloudcrane_deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "root@$DEPLOY_HOST" "deploy $DEPLOY_SHA"

      - name: Verify public production endpoints
        if: steps.changes.outputs.deploy_required == 'true'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            https://app.itkdm.com/api/auth/get-session >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            https://app.itkdm.com/agent/health >/dev/null
